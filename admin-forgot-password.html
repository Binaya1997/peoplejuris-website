<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PeopleJuris LLP</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: 
                radial-gradient(circle at 50% 30%, rgba(19, 34, 61, 0.7) 0%, rgba(6, 11, 20, 0.98) 80%),
                var(--pj-navy-950);
            position: relative;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: rgba(19, 34, 61, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: var(--pj-radius-xl);
            padding: 46px 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 175, 55, 0.12);
            position: relative;
            z-index: 2;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            text-decoration: none;
        }

        .auth-logo img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.4));
        }

        .auth-logo span {
            font-family: var(--pj-font-brand);
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .auth-logo .tm-mark {
            font-size: 0.52em;
            vertical-align: super;
            margin-left: 2px;
            font-family: var(--pj-font-body);
            font-weight: 700;
            color: var(--pj-gold-300);
            letter-spacing: 0;
            display: inline-block;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.92rem;
            color: var(--pj-text-secondary);
            line-height: 1.6;
        }

        .auth-alert {
            display: none;
            padding: 12px 16px;
            border-radius: var(--pj-radius-md);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .auth-alert.error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .auth-alert.success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .recovery-info {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: var(--pj-radius-md);
            padding: 14px 16px;
            font-size: 0.86rem;
            color: var(--pj-gold-300);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .form-group input,
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            background: rgba(10, 17, 32, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #ffffff;
            font-family: var(--pj-font-body) !important;
            font-size: 1rem !important;
            line-height: 1.5 !important;
            padding: 14px 18px;
            border-radius: var(--pj-radius-md);
            box-sizing: border-box;
            transition: border-color var(--pj-transition-fast), box-shadow var(--pj-transition-fast);
        }

        .form-group input:focus {
            border-color: var(--pj-gold-400);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
            outline: none;
        }

        .form-group input::placeholder,
        .form-group input::-webkit-input-placeholder,
        .form-group input::-moz-placeholder,
        .form-group input:-ms-input-placeholder {
            color: rgba(255, 255, 255, 0.45) !important;
            font-family: var(--pj-font-body) !important;
            font-size: 0.95rem !important;
            font-weight: 400 !important;
            letter-spacing: normal !important;
            line-height: normal !important;
            opacity: 1 !important;
        }

        .form-group input:-webkit-autofill,
        .form-group input:-webkit-autofill:hover, 
        .form-group input:-webkit-autofill:focus,
        .form-group input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0a1120 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Hide native browser password reveal icon */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        .password-wrap {
            position: relative;
            width: 100%;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--pj-text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color var(--pj-transition-fast);
        }

        .password-toggle:hover {
            color: var(--pj-gold-400);
        }

        .return-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 26px;
            color: var(--pj-text-muted);
            font-size: 0.88rem;
            text-decoration: none;
            width: 100%;
            justify-content: center;
        }

        .return-link:hover {
            color: var(--pj-gold-400);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Ambient Background Glows -->
        <div class="ambient-canvas-wrapper" aria-hidden="true">
            <div class="ambient-glow-gold" style="top: 20%; right: 15%;"></div>
            <div class="ambient-glow-blue" style="bottom: 20%; left: 15%;"></div>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo" aria-label="PeopleJuris Home">
                    <img src="images/favicon.png" alt="PeopleJuris Logo">
                    <span>peoplejuris<sup class="tm-mark">™</sup></span>
                </a>
                <h1>Account Recovery</h1>
                <p>Reset your administrator password using your offline backup recovery code.</p>
            </div>

            <div class="recovery-info">
                <i class="fas fa-shield-alt" style="margin-right: 6px;"></i>
                <strong>Single-Use Code:</strong> Each backup recovery code can only be used once. After resetting your password, generate a fresh code from your dashboard.
            </div>

            <div id="alertBox" class="auth-alert" role="alert"></div>

            <form id="recoveryForm">
                <div class="form-group">
                    <label for="username">Administrator Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="recoveryCode">16-Character Backup Recovery Code</label>
                    <input type="text" id="recoveryCode" name="recovery_code" placeholder="XXXX-XXXX-XXXX-XXXX" required autocomplete="off" style="letter-spacing: 1.5px; font-family: monospace; text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password (Min 8 characters)</label>
                    <div class="password-wrap">
                        <input type="password" id="newPassword" name="new_password" placeholder="Enter new password" required autocomplete="new-password" style="padding-right: 42px;">
                        <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show or hide new password">
                            <i class="far fa-eye" id="eyeIconNew"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password" style="padding-right: 42px;">
                        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show or hide confirm password">
                            <i class="far fa-eye" id="eyeIconConfirm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" style="margin-top: 20px;">
                    <span id="btnText">Reset Password</span>
                    <i class="fas fa-key" style="margin-left: 8px;"></i>
                </button>
            </form>

            <a href="admin-login.html" class="return-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Admin Login</span>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('recoveryForm');
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const codeInput = document.getElementById('recoveryCode');

            // Setup password toggles
            function setupToggle(btnId, inputId, iconId) {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (!btn || !input || !icon) return;
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    const isPass = input.type === 'password';
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.type = isPass ? 'text' : 'password';
                    icon.className = isPass ? 'far fa-eye-slash' : 'far fa-eye';
                    input.focus();
                    if (start !== null && end !== null) {
                        input.setSelectionRange(start, end);
                    }
                });
            }
            setupToggle('toggleNewPassword', 'newPassword', 'eyeIconNew');
            setupToggle('toggleConfirmPassword', 'confirmPassword', 'eyeIconConfirm');

            // Format recovery code as user types: XXXX-XXXX-XXXX-XXXX
            codeInput.addEventListener('input', function (e) {
                let val = this.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                if (val.length > 16) val = val.substring(0, 16);
                let formatted = '';
                for (let i = 0; i < val.length; i++) {
                    if (i > 0 && i % 4 === 0) formatted += '-';
                    formatted += val[i];
                }
                this.value = formatted;
            });

            // Backend URL resolution
            let customBackend = (localStorage.getItem('pj_backend_url') || '').trim();
            if (customBackend.endsWith('/')) customBackend = customBackend.slice(0, -1);

            let apiBase = '';
            if (customBackend) {
                apiBase = customBackend;
            } else if (window.location.protocol === 'file:') {
                apiBase = 'http://localhost:8000';
            } else if (window.location.port !== '8000' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                apiBase = 'http://localhost:8000';
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                alertBox.className = 'auth-alert';
                alertBox.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const recovery_code = codeInput.value.trim();
                const new_password = document.getElementById('newPassword').value;
                const confirm_password = document.getElementById('confirmPassword').value;

                if (!username || !recovery_code || !new_password) {
                    alertBox.className = 'auth-alert error';
                    alertBox.style.display = 'flex';
                    alertBox.textContent = 'Please fill out all required fields.';
                    return;
                }

                if (new_password.length < 8) {
                    alertBox.className = 'auth-alert error';
                    alertBox.style.display = 'flex';
                    alertBox.textContent = 'New password must be at least 8 characters long.';
                    return;
                }

                if (new_password !== confirm_password) {
                    alertBox.className = 'auth-alert error';
                    alertBox.style.display = 'flex';
                    alertBox.textContent = 'Password confirmation does not match.';
                    return;
                }

                submitBtn.disabled = true;
                btnText.textContent = 'Verifying Code...';

                try {
                    const response = await fetch(apiBase + '/api/admin/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username, recovery_code, new_password })
                    });

                    let data = {};
                    const text = await response.text();
                    try {
                        data = text ? JSON.parse(text) : {};
                    } catch (parseErr) {
                        if (response.status === 404 || response.status === 405) {
                            throw new Error(`Endpoint not found (${response.status}). If deployed on static hosting (like GitHub Pages), the Python backend (server.py) is not active on this host.`);
                        }
                        throw new Error(`Server returned non-JSON response (${response.status}).`);
                    }

                    if (response.ok && data.success) {
                        alertBox.className = 'auth-alert success';
                        alertBox.style.display = 'flex';
                        alertBox.textContent = data.message || 'Password reset successfully! Redirecting to login...';
                        form.reset();
                        setTimeout(() => {
                            window.location.href = (window.location.protocol === 'file:' ? 'http://localhost:8000/' : '') + 'admin-login.html';
                        }, 2000);
                    } else {
                        alertBox.className = 'auth-alert error';
                        alertBox.style.display = 'flex';
                        alertBox.textContent = data.error || 'Failed to reset password. Please check your recovery code.';
                    }
                } catch (err) {
                    console.error('Password reset error:', err);
                    alertBox.className = 'auth-alert error';
                    alertBox.style.display = 'flex';
                    alertBox.textContent = `Server communication error: ${err.message || 'connection failed'}. Ensure backend server is reachable.`;
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Reset Password';
                }
            });
        });
    </script>
</body>
</html>
